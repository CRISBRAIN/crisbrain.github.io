<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>CRISBRAIN Decision</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f5f5f5;color:#161616;margin:0;padding:20px}.shell{max-width:820px;margin:auto}.status{background:#fff;padding:18px;border-radius:14px}.error{color:#8b1e1e}.muted{color:#666;font-size:13px}</style></head><body><div class="shell"><div id="status" class="status">Carregando decisão CRISBRAIN…</div><div id="content"></div></div><script>(async function(){'use strict';var API='https://axscqhvayfprggnkyerl.supabase.co/functions/v1/crisbrain-go-fallback';var q=new URLSearchParams(location.search);var receipt=(q.get('receipt')||'').trim();var partner=(q.get('partner')||'').trim().toLowerCase().replace(/[^a-z0-9._-]+/g,'-').slice(0,64);var source=(q.get('source')||'distribution_gateway').trim().toLowerCase().replace(/[^a-z0-9._-]+/g,'-').slice(0,64);var status=document.getElementById('status'),content=document.getElementById('content');if(!/^receipt-web-[a-z0-9]{16,48}$/.test(receipt)){status.className='status error';status.textContent='Publicação CRISBRAIN inválida.';return;}try{var r=await fetch(API+'/publication/'+encodeURIComponent(receipt),{cache:'no-store'});if(!r.ok)throw new Error('publication');var data=await r.json();if(!data.ok||!data.public_url||!data.destination_url||data.tracking_tag_verified!==true)throw new Error('governance');var page=await fetch(data.public_url,{cache:'no-store'});if(!page.ok)throw new Error('page');var html=await page.text();var doc=new DOMParser().parseFromString(html,'text/html');var main=doc.querySelector('main');if(!main)throw new Error('content');main.querySelectorAll('script,iframe,object,embed').forEach(function(n){n.remove();});var a=main.querySelector('a.cta');if(!a)throw new Error('cta');a.href=data.destination_url;a.rel='sponsored nofollow noopener';a.removeAttribute('target');a.addEventListener('click',function(){try{fetch(API+'/audit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({receipt_id:receipt,partner:partner||null,source:source}),keepalive:true}).catch(function(){});}catch(e){}});status.remove();content.replaceChildren(main);document.title=(doc.title||'CRISBRAIN Decision');}catch(e){status.className='status error';status.innerHTML='<strong>Esta publicação está temporariamente indisponível.</strong><p class="muted">Nenhum destino comercial foi aberto.</p>';}})();</script></body></html>
