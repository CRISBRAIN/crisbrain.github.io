name: Migrate CRISBRAIN CTA to Railway

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-cta-to-railway.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace only the CRISBRAIN server host in campaign CTAs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'https://crisbrain-server.onrender.com'
          new = 'https://crisbrain-server-production.up.railway.app'
          scanned = 0
          changed_files = 0
          replacements = 0

          for path in Path('campanhas').rglob('index.html'):
              scanned += 1
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if not count:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed_files += 1
              replacements += count

          print(f'CTA_MIGRATION scanned={scanned} changed_files={changed_files} replacements={replacements}')
          if replacements == 0:
              raise SystemExit('No old Render CTA host was found; aborting without commit.')
          PY

      - name: Verify migration before commit
        shell: bash
        run: |
          if grep -RIl --include='index.html' 'https://crisbrain-server.onrender.com' campanhas | grep -q .; then
            echo 'ERROR: old Render CTA host still exists in campaign HTML.'
            exit 1
          fi
          if ! grep -RIl --include='index.html' 'https://crisbrain-server-production.up.railway.app' campanhas | grep -q .; then
            echo 'ERROR: Railway CTA host was not written.'
            exit 1
          fi

      - name: Commit migrated CTAs
        shell: bash
        run: |
          git config user.name 'CRISBRAIN Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add campanhas
          git diff --cached --quiet && { echo 'No campaign changes to commit'; exit 1; }
          git commit -m 'Migrate CRISBRAIN Web CTAs from Render to Railway'
          git push origin HEAD:main
